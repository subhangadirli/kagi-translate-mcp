name: Docker smoke

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v2
        with:
          version: 11.2.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Build Docker image
        run: docker build -t kagi-translate-mcp:ci .
      - name: Run health check
        run: |
          set -e
          docker run --rm kagi-translate-mcp:ci node dist/index.js --health | grep -q '^ok$'
      - name: Run version check
        run: |
          docker run --rm kagi-translate-mcp:ci node dist/index.js --version | grep -E '^\d+\.\d+\.\d+'
